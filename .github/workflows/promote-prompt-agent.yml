name: Promote prompt agent

# Reads the newest version of a prompt agent in the dev project and pushes it to a branch.
# A pull request from that branch goes through the same review and approval as code.
on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Prompt agent name"
        default: "deviation-note-writer"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: write
      id-token: write
    env:
      FOUNDRY_DEV_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_DEV_PROJECT_ENDPOINT }}
      AGENT: ${{ inputs.agent }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r agent/requirements.txt
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Export the newest dev version
        run: python deploy/prompt_agent.py export "$AGENT"
      - name: Push a branch for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompt-agents/
          if git diff --cached --quiet; then
            echo "The dev version is already in main." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="prompt-agent/$AGENT"
          git switch -c "$branch"
          git commit -m "Promote prompt agent $AGENT from dev"
          git push --force origin "$branch"
          echo "Open a pull request: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1" | tee -a "$GITHUB_STEP_SUMMARY"
